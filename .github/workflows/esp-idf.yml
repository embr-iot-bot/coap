name: ESP-IDF

on:
  push:
    branches: [ "feat/**", "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [v5.4.4, v5.5.5, v6.0.3, v6.1]
        target: [esp32, esp32s3, esp32c3, esp32c6]
        include:
        - version: v6.0.3
          target: esp32
          qemu: true
        - version: v6.0.3
          target: esp32s3
          qemu: true
        - version: v6.1
          target: esp32
          qemu: true
        # esp32c3 QEMU previously hung past bootloader on sibling repos; omit for now.

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: "build"
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.version }}
        target: ${{ matrix.target }}
        path: 'test/esp-idf/catch'
        command: "idf.py build"

    # Catch2 on-device suite (not Unity). Look for app_main success marker.
    - name: "qemu"
      timeout-minutes: 2
      if: matrix.qemu
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ matrix.version }}
        target: ${{ matrix.target }}
        path: 'test/esp-idf/catch'
        command: idf.py qemu --qemu-extra-args="-no-reboot" | tee qemu_output.txt

    - name: Catch output inspection
      if: matrix.qemu
      working-directory: test/esp-idf/catch
      run: |
        set -euo pipefail
        if ! grep -q "Test passed\." qemu_output.txt; then
          echo "QEMU Catch run did not report success"
          cat qemu_output.txt
          exit 1
        fi
        echo "QEMU Catch marker found"
